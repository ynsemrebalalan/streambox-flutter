workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    # App Store Connect API entegrasyonu. Codemagic UI'da:
    #   Teams/Settings -> Integrations -> App Store Connect
    # Asagidaki ad, oradaki integration adiyla BIREBIR (buyuk/kucuk harf
    # dahil) eslesmeli. Eslesmezse "integration not found" hatasi alinir.
    integrations:
      app_store_connect: Codemagic

    environment:
      # CERTIFICATE_PRIVATE_KEY ortam degiskeni "signing" grubunda olmali
      # (Codemagic UI -> Environment variables -> group: signing, Secure).
      groups:
        - signing
      flutter: 3.41.5
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.ynsemrebalalan.iptvai"

    scripts:
      # 1) Swift Package Manager'i KAPAT — her seyden ONCE.
      #    Gerekcesi google_mobile_ads (CocoaPods-only) ile
      #    webview_flutter_wkwebview (SPM destekli) cakismasiydi.
      #    2026-08-29: google_mobile_ads uygulamadan tamamen cikarildi, yani bu
      #    adim ARTIK ZORUNLU DEGIL. Yine de birakildi: tum pod'lari tek
      #    yonetici (CocoaPods) altinda tutmak, calisan build'i SPM'e gecirip
      #    yeni sorun uretmekten daha guvenli. Kaldirmak istersen once bir
      #    deneme build'i al.
      - name: Swift Package Manager kapat
        script: |
          flutter config --no-enable-swift-package-manager
          flutter config --list | grep -i "swift-package-manager" || true

      - name: Flutter pub get
        script: flutter pub get

      # 2) Imzalama — App Store Connect API ile profil/sertifika fetch (yoksa
      #    --create ile olustur), keychain'e ekle, Xcode projesine uygula.
      #    integrations bloku ASC kimlik bilgilerini env'e otomatik enjekte eder.
      - name: Code signing setup
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type=IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

      # 3) Build no = Unix timestamp. KESIN COZUM (2026-05-29).
      #
      # GECMIS: ASC sorgusu + max + 1 yaklasimi 3 kez reject yedi
      #   (2026-05-26, 2026-05-28, 2026-05-29 / build 76).
      # KOK NEDEN: Reject/invalid/processing durumundaki bir build,
      #   get-latest-testflight-build-number VE get-latest-app-store-build-number
      #   sorgularinda GORUNMEZ (0 doner). pubspec build'i sabit oldugu icin
      #   her run AYNI carpisan numarayi uretip "previousBundleVersion already
      #   used" (409) reject'i aliyordu. ASC state'ine guvenmek guvenilmez.
      #
      # COZUM: Unix timestamp (saniye). Her zaman onceki tum build'lerden
      #   buyuk, monotonik, ASC state'inden tamamen bagimsiz, asla carpismaz.
      #   ~1.74 milyar << CFBundleVersion limiti (4294967295). Apple kabul eder.
      #   version: 2.0.0 (gorunen surum) DEGISMEZ, sadece dahili build no.
      - name: Auto-increment build number
        script: |
          NEW_BUILD=$(date +%s)
          echo "Build number (unix timestamp): $NEW_BUILD"
          echo "BUILD_NUMBER=$NEW_BUILD" >> $CM_ENV

      # 4) IPA uret. "flutter build ipa" pub get + pod install'i kendi de yapar;
      #    SPM kapali oldugu icin pod install temiz gecer.
      - name: Build iOS IPA (release)
        script: flutter build ipa --release --build-number=$BUILD_NUMBER

      # 5) Crashlytics dSYM upload. Bu adim OLMADAN iOS crash'leri
      #    Crashlytics'e duser ama sembolize EDILMEZ — stack trace'ler
      #    ham adres olarak gorunur ve ise yaramaz.
      #
      #    Xcode "run script build phase" yerine burada yapiliyor: pbxproj'a
      #    dokunmuyoruz (bozulursa TUM iOS build'leri patlar) ve CI log'unda
      #    ne olup bittigi acikca gorunuyor.
      #
      #    -gsp: GoogleService-Info.plist diskte mevcut (Xcode bundle'ina
      #    ekli degil, ama upload-symbols icin dosya yolu yeterli).
      - name: Crashlytics dSYM upload
        script: |
          set -e
          # CM_BUILD_DIR normalde clone dizini; set degilse cwd'ye dus.
          ROOT="${CM_BUILD_DIR:-$PWD}"
          echo "ROOT=$ROOT"
          GSP="$ROOT/ios/Runner/GoogleService-Info.plist"
          UPLOAD=$(find "$ROOT/ios/Pods" -name upload-symbols -type f 2>/dev/null | head -1)

          if [ ! -f "$GSP" ]; then
            echo "!! UYARI: GoogleService-Info.plist yok -> dSYM YUKLENMEDI"
            exit 0
          fi
          if [ -z "$UPLOAD" ]; then
            echo "!! UYARI: upload-symbols bulunamadi (FirebaseCrashlytics pod kurulu mu?) -> dSYM YUKLENMEDI"
            exit 0
          fi

          DSYMS=$(find "$ROOT/build/ios" -name "*.dSYM" -type d 2>/dev/null)
          if [ -z "$DSYMS" ]; then
            echo "!! UYARI: dSYM bulunamadi -> crash'ler sembolize EDILMEYECEK"
            exit 0
          fi

          # Buraya geldiysek arac ve dosyalar yerinde; upload hatasi GERCEK
          # hatadir, sessizce yutma — build'i durdur ki fark edelim.
          echo "$DSYMS" | while read -r d; do
            echo ">> upload: $d"
            "$UPLOAD" -gsp "$GSP" -p ios "$d"
          done
          echo "Crashlytics dSYM upload tamam."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # TestFlight'a otomatik yukleme. Ayni "Codemagic" ASC API entegrasyonu
    # kullanilir (integrations bloku). submit_to_app_store: false — App Store
    # gonderimi manuel (review'a yollarken karar).
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ── Android — Play Store / Internal testing AAB build ────────────────────
  # Tetik: Codemagic UI -> Applications -> streambox-flutter -> Start new build
  #        -> android-release / master
  #
  # Onkosul: Codemagic UI -> Application -> Code signing identities (Android):
  #   - Reference name: streambox_keystore
  #   - keystore: streambox.jks (kullanici upload eder)
  android-release:
    name: Android Play Store Release
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: 3.41.5

      android_signing:
        - streambox_keystore

      vars:
        PACKAGE_NAME: "com.ynsemrebalalan.iptvai"
      # Secret variables (Codemagic UI):
      #   GROQ_PROXY_URL, GROQ_PROXY_SECRET, REVENUECAT_ANDROID_KEY, REVENUECAT_IOS_KEY

    scripts:
      - name: Flutter version
        script: flutter --version

      # pubspec.lock silinmiyor — reproducible build.
      - name: Temiz ortam
        script: flutter clean

      - name: Flutter pub get
        script: flutter pub get

      - name: Auto-increment versionCode
        script: |
          PUBSPEC_BUILD=$(grep "^version:" pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          BUILD_NUMBER=$PUBSPEC_BUILD
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          echo "Building versionCode=$BUILD_NUMBER"

      - name: Build AAB (release, signed)
        script: |
          flutter build appbundle \
            --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=GROQ_PROXY_URL=$GROQ_PROXY_URL \
            --dart-define=GROQ_PROXY_SECRET=$GROQ_PROXY_SECRET \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY \
            --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY

      - name: Build APK (release, signed) — yan yukleme/test
        script: |
          flutter build apk \
            --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=GROQ_PROXY_URL=$GROQ_PROXY_URL \
            --dart-define=GROQ_PROXY_SECRET=$GROQ_PROXY_SECRET \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY \
            --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - vibedaveddeva@gmail.com
        notify:
          success: true
          failure: true
